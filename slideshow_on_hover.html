<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hover Slideshow Links</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 40px;
  }

  a.hover-link {
    display: block;
    margin: 20px 0;
    font-size: 20px;
    color: #0066cc;
    text-decoration: none;
    width: fit-content;
  }

  a.hover-link:hover {
    text-decoration: underline;
  }

  #slideshow {
    position: fixed;
    pointer-events: none;
    display: none;
    width: 200px;
    height: 200px;
    overflow: hidden;
    background: #000;
  }

  #slideshow img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<a href="#" class="hover-link" data-images="nature">Link One</a>
<a href="#" class="hover-link" data-images="city">Link Two</a>
<a href="#" class="hover-link" data-images="animals">Link Three</a>

<div id="slideshow">
  <img src="" alt="">
</div>

<script>
  const slideshow = document.getElementById("slideshow");
  const img = slideshow.querySelector("img");

  let interval = null;
  let index = 0;

  const imageSets = {
    nature: [
      "https://picsum.photos/400/300?random=1",
      "https://picsum.photos/400/300?random=2",
      "https://picsum.photos/400/300?random=3",
      "https://picsum.photos/400/300?random=4"
    ],
    city: [
      "https://picsum.photos/400/300?random=5",
      "https://picsum.photos/400/300?random=6",
      "https://picsum.photos/400/300?random=7",
      "https://picsum.photos/400/300?random=8"
    ],
    animals: [
      "https://picsum.photos/400/300?random=9",
      "https://picsum.photos/400/300?random=10",
      "https://picsum.photos/400/300?random=11",
      "https://picsum.photos/400/300?random=12"
    ]
  };

  document.querySelectorAll(".hover-link").forEach(link => {
    const images = imageSets[link.dataset.images];

    link.addEventListener("mouseenter", () => {
      index = 0;
      slideshow.style.display = "block";
      img.src = images[index];

      interval = setInterval(() => {
        index = (index + 1) % images.length;
        img.src = images[index];
      }, 120); // rapid slideshow speed
    });

    link.addEventListener("mousemove", e => {
      slideshow.style.left = e.clientX + 20 + "px";
      slideshow.style.top = e.clientY + 20 + "px";
    });

    link.addEventListener("mouseleave", () => {
      clearInterval(interval);
      slideshow.style.display = "none";
    });
  });
</script>

</body>
</html>
